# TrendScope Docker Compose
# Traefik/Coolify deployment profile:
# - Only frontend is externally routable (via Coolify domain routing)
# - Backend, Redis, and Celery services stay internal

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_URL: http://backend:8000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_PATH: /app/data/sentiment_history.db
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    volumes:
      - sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 75s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_tasks worker --loglevel=info --concurrency=1 --max-tasks-per-child=1 --prefetch-multiplier=1 --without-gossip --without-mingle --without-heartbeat
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_PATH: /app/data/sentiment_history.db
      PYTHONUNBUFFERED: "1"
      C_FORCE_ROOT: "true"
    volumes:
      - sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_tasks beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_PATH: /app/data/sentiment_history.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - sqlite-data:/app/data
      - celerybeat-schedule:/app/schedule
    depends_on:
      redis:
        condition: service_started
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  sqlite-data:
    driver: local
  redis-data:
    driver: local
  celerybeat-schedule:
    driver: local

networks:
  app:
    driver: bridge
